version: '3.8'

services:
  digicab-ml:
    build: .
    container_name: digicab-ml
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/database.db
    volumes:
      - digicab_data:/app/data

volumes:
  digicab_data:
    driver: local
